<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Katch</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
/* Layout: app shell — header, scrolling cards, floating pill nav. Dark only (Telegram look). */
:root{
  --safe-top:max(env(safe-area-inset-top,0px),calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
  --safe-bottom:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  --bg:#0b0b0c;--card:#141416;--card2:#1c1c1f;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --ink:#f4f4f5;--muted:#9c9ca3;--faint:#6b6b72;
  --signal:#c6ff3d;--signal-dim:rgba(198,255,61,.12);--signal-line:rgba(198,255,61,.42);--signal-held:#6b8020;--void:#ff5c4d;
  --sans:"Onest",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  --r-lg:22px;--r:16px;--r-sm:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--mono)}
.label{font:500 11px/16px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.label.lime{color:var(--signal)}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:19px}
.lime{color:var(--signal)}
.app{min-height:var(--tg-viewport-stable-height,100dvh);display:flex;flex-direction:column;max-width:520px;margin:0 auto}

/* Header */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + var(--safe-top)) 16px 12px;background:linear-gradient(var(--bg) 70%,rgba(11,11,12,0))}
.brandmark{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;background:none;border:0;padding:0;cursor:pointer}
.pillgroup{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.pillgroup button{height:36px;min-width:40px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pillgroup .lang{font:500 12px var(--mono);color:var(--muted)}
.backpill{height:40px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;display:flex;align-items:center;gap:6px;cursor:pointer}
.pagehead{display:flex;align-items:center;gap:10px;min-width:0}
.pagehead h2{margin:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo{margin:0 16px;padding:8px 12px;border-radius:var(--r-sm);background:var(--card);border:1px dashed var(--line2);font-size:12px;color:var(--muted);text-align:center}

.content{flex:1;display:flex;flex-direction:column;gap:14px;padding:8px 16px 28px}
.has-tabs .content{padding-bottom:calc(128px + var(--safe-bottom))}
.content{padding-bottom:calc(28px + var(--safe-bottom))}
h1{margin:0;font-size:28px;line-height:32px;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
h1.hero{font-size:40px;line-height:42px;font-weight:700;letter-spacing:-.045em}
.hl{color:var(--signal);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
p{margin:0}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.card.glow{border-color:var(--signal-line);background:radial-gradient(120% 90% at 100% 0%,rgba(198,255,61,.09),rgba(198,255,61,0) 55%),var(--card);padding:24px 20px;gap:16px}
.card.tight{padding:14px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line2);background:transparent;color:var(--ink);font-weight:600;font-size:16px;text-decoration:none;cursor:pointer;width:100%}
.btn.ask{background:var(--signal);border-color:var(--signal);color:#0b0b0c;font-weight:700}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#0b0b0c;font-weight:700}
.btn.limeline{border-color:var(--signal-line);background:var(--signal-dim);color:var(--signal);width:auto;align-self:flex-start}
.btn.bid{border-color:var(--ink)}
.btn.sm{min-height:42px;width:auto;font-size:13px;padding:0 14px;border-radius:var(--r-sm)}
.btn.split{justify-content:space-between}
.btn[disabled]{opacity:.45;cursor:default}

.input{width:100%;height:50px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--card2);color:var(--ink);font-size:15px;outline:none}
.input:focus{border-color:var(--signal-line)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--signal);border-color:var(--signal);color:#0b0b0c}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:54px;padding:6px 6px 6px 14px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-sm)}
.codebox .v{font-family:var(--mono);font-size:17px;font-weight:500;word-break:break-all}
.codebox .v.big{font-size:20px}
.money{font-family:var(--mono);font-weight:500;padding:2px 8px;border-radius:8px;background:var(--signal);color:#0b0b0c;display:inline-block}
.money.held{background:var(--signal-dim);color:var(--ink)}
.track{height:6px;border-radius:999px;background:var(--card2);overflow:hidden;display:flex}
.track i{display:block;height:100%;background:var(--signal)}
.track i.held{background:var(--signal-held)}
.offer{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);text-align:left;width:100%;cursor:pointer}
.offer:hover{border-color:var(--line2)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.title{font-size:16px;font-weight:600}
.tag{font:500 11px var(--mono);padding:3px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid2>div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fig{font:500 20px var(--mono);font-variant-numeric:tabular-nums}
.unit{font:400 11px var(--mono);color:var(--muted);text-transform:uppercase}
ul.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:20px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.item{display:flex;gap:12px;align-items:center;padding:13px 14px;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;width:100%}
.item:first-child{border-top:0}
.dot{width:8px;height:8px;border-radius:999px;flex-shrink:0}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.status.bad{color:var(--void)}
.err{color:var(--void);font-size:13px}
.ok{font-size:13px;color:var(--signal)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats>div{padding:12px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.stats .fig{font-size:17px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:12px;align-items:center;border:1px dashed var(--line2);border-radius:var(--r-lg)}
.radio{display:flex;align-items:center;gap:12px;padding:15px 16px;border-top:1px solid var(--line);cursor:pointer}
.radio:first-child{border-top:0}
.radio.on{background:var(--card2)}
.radio input{accent-color:var(--signal);width:18px;height:18px;margin:0}
.timeline{display:flex;flex-direction:column;font-size:13px;line-height:19px;color:var(--muted)}
.timeline div{display:flex;gap:10px;padding:4px 0}
.timeline b{font-family:var(--mono);font-weight:500;color:var(--signal);min-width:18px}
.spin{padding:48px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:16px;right:16px;bottom:104px;z-index:9;max-width:488px;margin:0 auto;padding:12px 14px;border-radius:var(--r);background:var(--card2);border:1px solid var(--line2);font-size:14px;text-align:center}

/* Ticker of plain facts */
.ticker{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -16px;padding:10px 0;white-space:nowrap}
.ticker .run{display:inline-flex;gap:28px;padding-left:16px;animation:tick 26s linear infinite;font:500 12px var(--mono);color:var(--signal)}
.ticker .run span::after{content:"✦";color:#ff8a3d;margin-left:28px;font-size:10px}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .run{animation:none}}

/* Calculator */
.calc-out{display:flex;align-items:baseline;gap:8px}
.calc-out .cur{font:700 22px var(--mono);color:var(--signal)}
.calc-out .big{font:600 44px/1 var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.calc-out .per{font:400 12px var(--mono);color:var(--muted);text-transform:uppercase}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:4px 0;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(to right,var(--signal) var(--p),#2a2a2e var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:999px;background:linear-gradient(to right,var(--signal) var(--p),#2a2a2e var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:999px;background:var(--signal);border:5px solid #1b2a06;margin-top:-10px;box-shadow:0 0 0 2px var(--signal)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:999px;background:var(--signal);border:4px solid #1b2a06;box-shadow:0 0 0 2px var(--signal)}
.scale{display:flex;justify-content:space-between;font:400 12px var(--mono);color:var(--faint);text-transform:uppercase}

/* Profile: bank card */
.link-btn{background:none;border:0;padding:8px 4px;color:var(--muted);cursor:pointer;font:inherit}
.cardwrap{perspective:900px}
.bankcard{position:relative;overflow:hidden;aspect-ratio:1.586/1;max-width:100%;border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(120% 100% at 0% 0%,#303036 0%,#17171a 52%,#0f0f11 100%);border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 28px 50px -28px rgba(198,255,61,.35);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out;transform-style:preserve-3d}
.bankcard>*{position:relative;z-index:1}
.bankcard .bc-lines{position:absolute;inset:0;z-index:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.022) 0 2px,transparent 2px 8px)}
.bankcard .bc-glow{position:absolute;z-index:0;right:-25%;bottom:-45%;width:85%;height:95%;border-radius:50%;background:radial-gradient(closest-side,rgba(198,255,61,.22),rgba(198,255,61,0))}
.bankcard .wm{position:absolute;z-index:0;right:-18px;bottom:-30px;opacity:.14;line-height:0;pointer-events:none}
.bankcard::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.09) 48%,transparent 60%);transform:translateX(-120%);animation:sheen 2.4s ease-out .3s 1 forwards}
@keyframes sheen{to{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){.bankcard::after{animation:none;display:none}.bankcard{transform:none}}
.bc-top{display:flex;align-items:center;justify-content:space-between}
.bc-brand{display:flex;align-items:center;gap:8px}
.bc-right{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.7)}
.bc-role{font:500 10px var(--mono);letter-spacing:.14em;padding:5px 8px;border-radius:6px;border:1px solid var(--signal-line);color:var(--signal);background:rgba(198,255,61,.06)}
.bc-chip{width:46px;height:35px;border-radius:7px;background:linear-gradient(135deg,#efdb9a 0%,#c9a752 45%,#a07f33 100%);position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.bc-chip::before{content:"";position:absolute;inset:7px 0;border-top:1px solid rgba(0,0,0,.22);border-bottom:1px solid rgba(0,0,0,.22)}
.bc-chip::after{content:"";position:absolute;inset:0 15px;border-left:1px solid rgba(0,0,0,.22);border-right:1px solid rgba(0,0,0,.22)}
.bc-num{font:500 18px var(--mono);letter-spacing:.16em;color:#e9e9ec;text-shadow:0 1px 0 rgba(0,0,0,.6);white-space:nowrap}
.bc-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.bc-k{font:500 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.bc-name{font:500 14px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#f1f1f3;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc-bal{font:600 26px/1.05 var(--mono);color:var(--signal);font-variant-numeric:tabular-nums}
@media (max-width:360px){.bc-num{font-size:15px}.bc-bal{font-size:22px}}
.menu{display:flex;flex-direction:column;gap:10px}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);text-align:left;width:100%;cursor:pointer}
.menu-item .ic{width:46px;height:46px;flex-shrink:0;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--signal)}
.menu-item .ic svg{width:20px;height:20px}
.menu-item .tx{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.menu-item .tx b{font-size:16px;font-weight:600}
.menu-item .tx span{font-size:13px;color:var(--muted)}
.menu-item .chev{color:var(--muted);font-size:20px}
.menu-item.accent{border-color:var(--signal-line)}
.menu-item.accent .tx b{color:var(--signal)}
.menu-item.hot{border-color:rgba(255,138,61,.45);background:linear-gradient(120deg,rgba(255,138,61,.22),rgba(255,138,61,.04)),var(--card)}
.menu-item.hot .ic{color:#ff8a3d}

/* Report sample */
.rtable{width:100%;border-collapse:collapse;font:400 12px var(--mono);font-variant-numeric:tabular-nums}
.rtable th{font-weight:500;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);text-transform:uppercase;font-size:10px;letter-spacing:.08em}
.rtable td{padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.rtable .r{text-align:right}
.rtable tfoot td{border-bottom:0;font-weight:600;color:var(--ink)}
.scrollx{overflow-x:auto;margin:0 -4px}
.checks{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;font-size:14px;line-height:20px}
.checks li{display:flex;gap:10px}
.checks li::before{content:"";flex-shrink:0;width:18px;height:18px;margin-top:1px;border-radius:6px;background:var(--signal-dim);border:1px solid var(--signal-line)}

/* Floating nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:520px;margin:0 auto;display:flex;gap:10px;padding:0 12px calc(12px + var(--safe-bottom));pointer-events:none}
.tabs .pill{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px;border-radius:999px;background:rgba(24,24,27,.88);border:1px solid var(--line2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);pointer-events:auto}
.tabs button{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer}
.tabs button.on{color:var(--signal);background:rgba(255,255,255,.07)}
.tabs svg{width:20px;height:20px}
.tabs .circle{width:68px;height:68px;flex-shrink:0;border-radius:999px;background:rgba(24,24,27,.88);border:1px solid var(--line2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);pointer-events:auto}
.tabs .circle.on{border-color:var(--signal-line);background:rgba(24,24,27,.88)}
</style>
</head>

class HttpApi {
  async call(path, body) {
    let res;
    try {
      res = await fetch(CFG.API_URL.replace(/\/$/, '') + path, {
        method: body ? 'POST' : 'GET',
        headers: Object.assign({ 'x-telegram-init-data': (tg && tg.initData) || '' }, body ? { 'Content-Type': 'application/json' } : {}),
        body: body ? JSON.stringify(body) : undefined
      });
    } catch (e) { throw new Error('network'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'server_error');
    return data;
  }
  me() { return this.call('/me', {}); }
  settings(p) { return this.call('/settings', p); }
  addAccount(platform, handle) { return this.call('/account', { platform, handle }); }
  offers() { return this.call('/offers'); }
  take(offer_id) { return this.call('/take', { offer_id }); }
  getTake(id) { return this.call('/take/' + id); }
  addClip(take_id, url) { return this.call('/clip', { take_id, url }); }
  cancelTake(id) { return this.call('/take/' + id + '/cancel', {}); }
  clips() { return this.call('/clips'); }
  wallet() { return this.call('/wallet'); }
  payout(method, address) { return this.call('/payout', { method, address }); }
}

  addAccount(platform, handle) {

    if (this.clipsArr.some((c) => c.url === u.href)) return this.fail('duplicate_clip');
    const tk = this.takes.find((x) => x.id === take_id);
    const c = { id: 'c' + Date.now(), take_id, offer_id: tk.offer_id, url: u.href, platform, status: 'review', created_at: new Date().toISOString() };

      clips: this.clipsArr.map((c) => Object.assign({}, c, { offers: off(c.offer_id), paid: false }))
    });

    const now = new Date().toISOString();

    const now = new Date().toISOString();
    const free = this.clipsArr.filter((c) => c.status === 'approved' && !c.payout_id && c.hold_until <= now);

    return this.wait({ payout: p });
  }
}

// ================= НАВІГАЦІЯ =================
// Навігація як у звичайному застосунку:
// • вибір ролі — корінь;
// • вкладки (Головна, Оффери, Кабінет, Профіль) — один рівень під ним: «Назад» з будь-якої вкладки веде на вибір ролі,
//   а перемикання вкладок не накопичує історію;
// • деталі (оффер, вивід коштів, сторінка бренду) відкриваються поверх і «Назад» повертає туди, звідки прийшов.
const TABS = ['home', 'feed', 'cabinet', 'profile'];
function go(screen, p) {
  if (TABS.includes(screen)) {
    S.stack = [{ screen: 'start', p: {} }];
  } else if (S.screen && S.screen !== 'loading' && S.screen !== 'fatal') {
    const top = S.stack[S.stack.length - 1];
    // той самий екран двічі поспіль не кладемо
    if (!(S.screen === screen && JSON.stringify(S.p) === JSON.stringify(p || {}))) S.stack.push({ screen: S.screen, p: S.p });
    // якщо повертаємось на екран, що вже є в історії, обрізаємо історію до нього
    const i = S.stack.findIndex((x) => x.screen === screen && JSON.stringify(x.p) === JSON.stringify(p || {}));
    if (i >= 0) S.stack = S.stack.slice(0, i);
    if (S.stack.length > 10) S.stack = S.stack.slice(-10);
    void top;
  }
  S.screen = screen; S.p = p || {}; S.err = ''; S.data = {};
  try { window.scrollTo(0, 0); } catch (e) {}
  load();
}
function back() {
  const prev = S.stack.pop();
  S.err = ''; S.data = {};
  if (prev) { S.screen = prev.screen; S.p = prev.p; }
  else if (S.screen !== 'start') { S.screen = 'start'; S.p = {}; }
  else return;
  try { window.scrollTo(0, 0); } catch (e) {}
  load();
}
const canGoBack = () => S.screen !== 'start' && S.screen !== 'loading' && S.screen !== 'fatal';

async function load() {
  render();
  try {
    if (S.screen === 'home' || S.screen === 'feed' || S.screen === 'offer') S.data = await api.offers();
    else if (S.screen === 'cabinet') S.data = await api.clips();
    else if (S.screen === 'profile' || S.screen === 'wallet') {
      S.data = await api.wallet();
      S.payMethod = S.data.payout_method || S.payMethod;
      S.payAddr = S.data.payout_address || S.payAddr;
    }
    S.data.ready = true;
  } catch (e) { S.err = e.message; S.data.ready = true; }
  render();
}

const niceRound = (n) => { const m = Math.pow(10, Math.max(0, Math.floor(Math.log10(n)) - 1)); return Math.round(n / m) * m; };
const viewsAt = (p) => niceRound(Math.pow(10, 4 + 3 * p / 100));         // 10 тис. … 10 млн
const budgetAt = (p) => niceRound(100 * Math.pow(200, p / 100));          // $100 … $20 000
function fmtViews(n) {
  const uk = S.lang === 'uk';
  if (n >= 1e6) return String(Math.round(n / 1e5) / 10).replace('.', uk ? ',' : '.') + (uk ? ' млн' : 'M');
  if (n >= 1e3) return Math.round(n / 1e3) + (uk ? ' тис.' : 'K');
  return String(n);
}
const intFmt = (n) => Math.round(n).toLocaleString(S.lang === 'uk' ? 'uk-UA' : 'en-US');
function clipperRate() {
  const live = (S.data.offers || []).map((o) => Number(o.rate_per_1k)).filter((x) => x > 0);
  return live.length ? Math.round(live.reduce((a, b) => a + b, 0) / live.length * 100) / 100 : Number(CFG.CLIPPER_RATE || 1);
}
const brandRate = () => Number(CFG.BRAND_CPM || 1.2);
function updateCalcs() {
  const v = document.getElementById('calcViews');
  if (v) {
    S.calcP = Number(v.value); v.style.setProperty('--p', S.calcP + '%');
    const views = viewsAt(S.calcP);
    document.getElementById('cvLabel').textContent = fmtViews(views);
    document.getElementById('cvMoney').textContent = intFmt(views / 1000 * clipperRate());
  }
  const b = document.getElementById('calcBudget');
  if (b) {
    S.bCalcP = Number(b.value); b.style.setProperty('--p', S.bCalcP + '%');
    const budget = budgetAt(S.bCalcP);
    document.getElementById('bvBudget').textContent = usd(budget).replace('.00', '');
    document.getElementById('bvViews').textContent = fmtViews(budget / brandRate() * 1000);
  }
}

function clipStatus(c) {
  const now = Date.now();
  if (c.status === 'rejected') return { text: t('st_rejected') + (c.reject_reason ? ' · ' + c.reject_reason : ''), color: 'var(--void)', bad: true };
  if (c.status === 'review') {
    const d = Math.floor((now - new Date(c.created_at).getTime()) / DAY);
    return d >= 7 ? { text: t('st_review_due'), color: 'var(--muted)' } : { text: t('st_review', { d: Math.max(1, d) }), color: 'var(--muted)' };
  }
  if (c.paid) return { text: t('st_paid'), color: 'var(--signal)' };
  if (c.payout_id) return { text: t('st_out'), color: 'var(--signal)' };
  if (c.hold_until && new Date(c.hold_until).getTime() > now) return { text: t('st_hold', { date: fmtDate(c.hold_until) }), color: 'var(--signal-held)', held: true };
  return { text: t('st_avail'), color: 'var(--signal)' };
}

      '<div class="card" style="gap:14px"><h1 style="font-size:24px;line-height:30px">' + esc(t('bCalcA')) + '<span class="lime" id="bvBudget">' + usd(budget).replace('.00', '') + '</span>?</h1>' +
        '<div class="calc-out"><span class="big" id="bvViews">' + esc(fmtViews(budget / rate * 1000)) + '</span><span class="per">' + esc(t('viewsWord')) + '</span></div>' +
        '<div><input type="range" id="calcBudget" min="0" max="100" step="1" value="' + S.bCalcP + '" style="--p:' + S.bCalcP + '%" aria-label="' + esc(t('budget')) + '">' +
        '<div class="scale"><span>$100</span><span>$20 000</span></div></div>' +
        '<p class="mono" style="font-size:12px;color:var(--muted)">' + esc(t('bCalcNoteA')) + '<span class="lime">' + usd(rate) + '</span>' + esc(t('bCalcNoteB')) + '</p></div>' +
      '<div class="card"><span class="label">' + esc(t('briefNeedTitle')) + '</span><ul class="checks">' +
        ['bn1', 'bn2', 'bn3', 'bn4', 'bn5', 'bn6'].map((k) => '<li>' + esc(t(k)) + '</li>').join('') + '</ul></div>' +
      '<div class="card"><span class="label">' + esc(t('howTitle')) + '</span><div class="timeline" style="gap:6px">' +
        [['b1', 'b1t'], ['b2', 'b2t'], ['b3', 'b3t'], ['b4', 'b4t']].map((x, i) => '<div><b>' + (i + 1) + '</b><span><span style="color:var(--ink);font-weight:600">' + esc(t(x[0])) + '.</span> ' + esc(t(x[1])) + '</span></div>').join('') + '</div></div>' +
      '<div class="card"><div class="row" style="align-items:center"><span class="label">' + esc(t('reportTitle')) + '</span><span class="tag">' + esc(t('reportSample')) + '</span></div>' +
        '<div class="scrollx"><table class="rtable"><thead><tr><th>' + esc(t('rcClip')) + '</th><th></th><th class="r">' + esc(t('rcViews')) + '</th><th class="r">' + esc(t('rcSum')) + '</th></tr></thead><tbody>' +
        sample.map((r) => '<tr><td>' + esc(r[0]) + '</td><td class="muted">' + r[1] + '</td><td class="r">' + intFmt(r[2]) + '</td><td class="r">' + cost(r[2]) + '</td></tr>').join('') +
        '</tbody><tfoot><tr><td>' + esc(t('rcTotal')) + '</td><td></td><td class="r">' + intFmt(totalViews) + '</td><td class="r"><span class="money">' + cost(totalViews) + '</span></td></tr></tfoot></table></div>' +
        '<p class="small muted">' + esc(t('reportNote')) + '</p></div>' +
      '<button class="btn ask split" data-a="chat"><span>' + esc(t('writeBrief')) + '</span>' + icons.ext + '</button>' +
      '<p class="small muted" style="text-align:center">' + esc(t('opensChat', { m: CFG.MANAGER })) + '</p></div>';
  }
};

function render() {
  const s = screens[S.screen] || screens.loading;
  document.documentElement.lang = S.lang;
  $app.className = 'app' + (['home', 'feed', 'cabinet', 'profile', 'wallet'].includes(S.screen) ? ' has-tabs' : '');
  $app.innerHTML = s();
  if (inTg && tg.BackButton) { if (canGoBack()) tg.BackButton.show(); else tg.BackButton.hide(); }
}

// ================= ДІЇ =================
$app.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a === 'pm') return; // радіо обробляє change
  if (el.tagName === 'A') ev.preventDefault();

  if (a === 'back') return back();
  if (a === 'home') { if (S.screen !== 'home') go('home'); return; }
  if (a === 'go') { if (v === S.screen && !el.dataset.focus) return; return go(v, el.dataset.focus ? { focus: el.dataset.focus } : {}); }
  if (a === 'copy') return copy(v);
  if (a === 'ext') return openExt(v);
  if (a === 'lang') {
    S.lang = S.lang === 'uk' ? 'en' : 'uk'; render();
    try { await api.settings({ lang: S.lang }); } catch (e) {}
    return;
  }
  if (a === 'chat') return openTg('https://t.me/' + CFG.MANAGER + '?text=' + encodeURIComponent(t('briefTpl')));
  if (a === 'support') return openTg('https://t.me/' + CFG.MANAGER + '?text=' + encodeURIComponent(t('supportMsg')));
  if (a === 'cat') { S.cat = v; return render(); }
  if (a === 'cancelAsk') { S.confirmCancel = v; return render(); }
  if (a === 'cancelNo') { S.confirmCancel = null; return render(); }
  if (a === 'cancelYes') {
    S.busy = true; render();
    try {
      await api.cancelTake(v); haptic('warning'); toast(t('cancelled'));
      S.confirmCancel = null; delete S.takeMsg[v];
      S.data = await api.clips(); S.data.ready = true;
    } catch (e) { S.err = e.message; haptic('error'); }
    S.busy = false; return render();
  }
  if (a === 'offer') return go('offer', { id: Number(v) });

  if (a === 'take') {
    S.busy = true; S.err = ''; render();
    try {
      await api.take(Number(v)); haptic('success'); toast(t('takenToast'));
      S.data = await api.offers(); S.data.ready = true;
    } catch (e) { S.err = e.message; haptic('error'); }
    S.busy = false; return render();
  }

  if (a === 'addClips') {
    const box = document.getElementById('urls-' + v);
    const urls = (box && box.value || '').split(/[\s,]+/).map((x) => x.trim()).filter(Boolean);
    if (!urls.length) return;
    S.busy = true; render();
    const res = { ok: 0, errors: [] };
    for (const u of [...new Set(urls)]) {
      try { await api.addClip(v, u); res.ok++; }
      catch (e) { res.errors.push({ url: u, code: e.message }); }
    }
    S.takeMsg[v] = res;
    haptic(res.errors.length ? 'warning' : 'success');
    try { S.data = await api.clips(); S.data.ready = true; } catch (e) { S.err = e.message; }
    S.busy = false; render();
    if (res.errors.length) { const b = document.getElementById('urls-' + v); if (b) b.value = res.errors.map((x) => x.url).join('\n'); }
    return;
  }

  if (a === 'payout') {
    S.payAddr = (document.getElementById('addr').value || '').trim();
    S.busy = true; S.err = ''; render();
    try {
      await api.payout(S.payMethod, S.payAddr); haptic('success'); toast(t('payoutDone'));
      S.data = await api.wallet(); S.data.ready = true;
    } catch (e) { S.err = e.message; haptic('error'); }
    S.busy = false; return render();
  }
});

$app.addEventListener('pointermove', (ev) => {
  const c = ev.target.closest && ev.target.closest('#bankcard');
  if (!c || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty('--ry', ((ev.clientX - r.left) / r.width - 0.5) * 10 + 'deg');
  c.style.setProperty('--rx', (0.5 - (ev.clientY - r.top) / r.height) * 8 + 'deg');
});
$app.addEventListener('pointerleave', (ev) => { const c = document.getElementById('bankcard'); if (c) { c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); } }, true);
$app.addEventListener('input', (ev) => {
  if (ev.target && (ev.target.id === 'calcViews' || ev.target.id === 'calcBudget')) updateCalcs();
});

$app.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.a === 'pm') {
    const addr = document.getElementById('addr');
    if (addr) S.payAddr = addr.value;
    S.payMethod = el.value; render();
  }
});

// ================= СТАРТ =================
(async function init() {
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.setHeaderColor('#0b0b0c'); tg.setBackgroundColor('#0b0b0c'); } catch (e) {}
    try { tg.BackButton.onClick(back); } catch (e) {}
  }
  if (!DEMO && !inTg) { S.err = 'unauthorized'; S.screen = 'fatal'; return render(); }
  try {
    const r = await api.me();
    S.user = r.user;
    S.lang = (r.user && r.user.lang) || 'uk';
    S.screen = 'start'; load();
  } catch (e) { S.err = e.message; S.screen = 'fatal'; render(); }
})();
})();
</script>
</body>
